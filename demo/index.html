<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Websites</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-gold"></div>
    </div>

    <main class="container">
        <div style="margin-bottom: 2rem;">
            <a href="../index.html" class="back-btn">← Back to Home</a>
        </div>
        
        <section class="glass-panel" id="demo-section">
            <div class="section-header" style="justify-content: flex-start; cursor: default; pointer-events: none;">
                <div class="header-title">
                    <div class="icon-wrap gold-bg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </div>
                    <h2>Demo Websites</h2>
                </div>
            </div>
            
            <div class="section-content">
                <div id="auth-container" class="auth-container">
                    <p>This section is protected. Please enter the password.</p>
                    <div class="input-group">
                        <div style="position: relative; flex: 1; display: flex;">
                            <input type="password" id="demo-password" placeholder="Enter password" style="width: 100%; padding-right: 40px;">
                            <button id="toggle-pwd-btn" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--color-text-light); padding: 0; min-width: auto; width: auto; box-shadow: none;">
                                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                        <button id="unlock-btn">Unlock</button>
                    </div>
                    <p id="auth-error" class="error-msg"></p>
                </div>

                <div class="links-grid hidden" id="demo-links">
                    <!-- Links will be injected here after auth -->
                </div>
            </div>
        </section>
    </main>

    <script src="../script.js"></script>
</body>
</html>
