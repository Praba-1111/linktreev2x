<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickLinks Hub - Home</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-blue"></div>
        <div class="blob blob-green"></div>
        <div class="blob blob-gold"></div>
    </div>

    <main class="container">
        <header>
            <h1>QuickLinks <span>Hub</span></h1>
            <p>Select a category to view links</p>
        </header>

        <div class="sections-wrapper" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem;">
            
            <a href="personal/index.html" class="glass-panel nav-card" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 1rem; padding: 1.5rem;">
                <div class="icon-wrap blue-bg" style="width: 56px; height: 56px; border-radius: 16px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
                <h2 style="color: var(--color-text); font-size: 1.25rem;">Personal</h2>
            </a>

            <a href="company/index.html" class="glass-panel nav-card" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 1rem; padding: 1.5rem;">
                <div class="icon-wrap green-bg" style="width: 56px; height: 56px; border-radius: 16px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </div>
                <h2 style="color: var(--color-text); font-size: 1.25rem;">Company</h2>
            </a>

            <a href="demo/index.html" class="glass-panel nav-card" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 1rem; padding: 1.5rem;">
                <div class="icon-wrap gold-bg" style="width: 56px; height: 56px; border-radius: 16px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </div>
                <h2 style="color: var(--color-text); font-size: 1.25rem;">Demo Websites</h2>
            </a>

        </div>
    </main>
</body>
</html>
